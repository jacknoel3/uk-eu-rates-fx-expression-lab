[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uk-eu-rates-fx-expression-lab"
version = "0.1.0"
description = "Foundation package for the UK-EU Rates-FX Trade Expression Lab."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = []
dependencies = [
  # Runtime dependencies will be selected after the Week 1 feasibility review.
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/uk_eu_rates_fx_lab"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["uk_eu_rates_fx_lab"]
strict = true
